name: Release Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows x64 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release artifacts & SHA256 checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/dupfinder.exe dist/dupfinder.exe
          $hash = (Get-FileHash dist/dupfinder.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  dupfinder.exe" | Out-File -FilePath dist/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dupfinder.exe
            dist/SHA256SUMS.txt
